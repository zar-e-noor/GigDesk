<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigDesk</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #F8FAFC;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #1E293B;
    }
    p {
      font-size: 13px;
      color: #475569;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0D9488;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0B7A70;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      background: #E2E8F0;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>GigDesk</h1>
  <p>Quick invoice creation from your browser</p>
  <button id="openDashboard">Open Dashboard</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
